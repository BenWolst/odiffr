# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, odiff ${{ matrix.config.odiff || 'latest' }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # Minimum supported R version (DESCRIPTION: R >= 4.1.0)
          - {os: ubuntu-latest,  r: '4.1'}
          # Minimum supported odiff version
          - {os: ubuntu-latest,  r: 'release', odiff: '4.1.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ODIFF_NPM_VERSION: ${{ matrix.config.odiff || 'latest' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install odiff (Unix)
        if: runner.os != 'Windows'
        run: |
          npm install -g "odiff-bin@${ODIFF_NPM_VERSION}"
          NPM_BIN=$(npm config get prefix)/bin
          echo "$NPM_BIN" >> $GITHUB_PATH

      - name: Install odiff (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install -g "odiff-bin@$env:ODIFF_NPM_VERSION"
          # npm rebuild fixes the cmd-shim bug where odiff.cmd runs .exe through node
          npm rebuild odiff-bin -g
          $npmPrefix = npm config get prefix
          echo "$npmPrefix" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify odiff installation
        run: odiff --version

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::png
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
